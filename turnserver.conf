# coturn config for Friends. Secrets / IP / cert paths are passed as CLI args from docker-compose.yml.

# STUN + TURN over UDP and TCP
listening-port=3478
# TURN over TLS (turns:)
tls-listening-port=5349
# To also serve turns: on 443 coturn needs its own public IP (Caddy owns 443 on the main one):
# alt-tls-listening-port=443   + listening-ip=<second ip>

# relay range (open UDP in the firewall)
min-port=49152
max-port=65535

fingerprint
# time-limited HMAC credentials from GET /turn-credentials
use-auth-secret
stale-nonce=600

# Limits
total-quota=1200
user-quota=12
max-bps=3000000

# TLS hardening (TLS < 1.2 is already refused by OpenSSL 3 defaults)
cipher-list="ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305"

# Security: never relay into private/internal networks (prevents SSRF through TURN)
no-multicast-peers
# Admin CLI stays disabled: no cli-password is set (and newer coturn disables it by default)
no-rfc5780
response-origin-only-with-rfc5780
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Drop root after reading certs
proc-user=nobody
proc-group=nogroup

log-file=stdout
simple-log
